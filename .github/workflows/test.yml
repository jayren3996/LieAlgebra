name: Test

on: [push, pull_request]

# The Wolfram test suite runs only when a license credential is configured.
# To enable CI: add a repository secret named WOLFRAMSCRIPT_ENTITLEMENTID holding a
# Wolfram on-demand license entitlement ID (Settings -> Secrets and variables -> Actions).
# Without it, the test job is skipped (the run stays green rather than failing).
jobs:
  check-license:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check for a Wolfram license secret
        id: check
        env:
          ENTITLEMENT: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
        run: |
          if [ -n "$ENTITLEMENT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No WOLFRAMSCRIPT_ENTITLEMENTID secret configured - skipping the Wolfram test suite."
          fi

  test:
    needs: check-license
    if: needs.check-license.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: wolframresearch/wolframengine:latest
      options: --user root
    env:
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run test suite
        run: wolframscript -file scripts/runTests.wls
