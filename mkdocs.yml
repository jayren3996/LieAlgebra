site_name: ClassicalLieAlgebra
site_description: >-
  Generators, bases, Young tableaux, and irreducible representations of the
  classical Lie algebras, for the Wolfram Language.
site_url: https://jayren3996.github.io/LieAlgebra/
repo_url: https://github.com/jayren3996/LieAlgebra
repo_name: jayren3996/LieAlgebra
edit_uri: ""
copyright: Copyright &copy; 2026 Jie Ren — released under the MIT License

# Built from a generated staging tree assembled by scripts/build-site.sh
# (the source Markdown lives in web/, docs/walkthrough.md, and is generated by
# scripts/generate-reference.wls). Do not point this at the repo's docs/ dir.
docs_dir: site-src

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/math-integral-box
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Guided tour: walkthrough.md
  - Tutorials:
      - tutorials/index.md
      - Getting started: tutorials/getting-started.md
      - Representations: tutorials/representations.md
      - Spinors: tutorials/spinors.md
      - Young tableaux: tutorials/young-tableaux.md
      - Physics applications: tutorials/physics-applications.md
  - Reference:
      - reference/index.md
      - Algebras & generators: reference/algebras.md
      - Root system: reference/root-system.md
      - Representations: reference/representations.md
      - Young tableaux: reference/young-tableaux.md
      - Glossary: glossary.md
  - About:
      - Why this package: comparison.md
      - Validation: validation.md
      - Changelog: changelog.md
      - Citing: cite.md

markdown_extensions:
  - abbr
  - attr_list          # buttons, image sizing, annotation markers
  - md_in_html         # the grid-cards <div markdown>
  - admonition
  - footnotes
  - pymdownx.details   # collapsible ??? admonitions
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jayren3996/LieAlgebra
      name: ClassicalLieAlgebra on GitHub
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
